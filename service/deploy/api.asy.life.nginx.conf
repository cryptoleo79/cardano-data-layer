# Cardano Data Layer — public read-only API reverse proxy.
# Proxies api.asy.life → the local Node service (user-systemd) on 127.0.0.1:8787.
# certbot --nginx adds the :443 server + TLS + the :80→:443 redirect.
server {
    server_name api.asy.life;

    # Security headers for a public-facing read-only API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CORS is emitted by the app itself (Access-Control-Allow-Origin: *) so
    # browser fetch() works; the API is read-only and unauthenticated.

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Block dotfiles except ACME challenge (certbot HTTP-01).
    location ~ /\.(?!well-known) { deny all; return 404; }

    listen 80;
    listen [::]:80;
}
